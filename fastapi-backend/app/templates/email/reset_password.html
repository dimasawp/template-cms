<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; margin: 0; padding: 0; }
        .container { max-width: 520px; margin: 40px auto; background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: #2563eb; color: #fff; padding: 24px 32px; }
        .header h1 { margin: 0; font-size: 20px; }
        .body { padding: 32px; line-height: 1.6; color: #333; }
        .code { display: inline-block; background: #f0f4ff; color: #2563eb; font-size: 28px; font-weight: bold; letter-spacing: 4px; padding: 12px 24px; border-radius: 6px; margin: 16px 0; }
        .footer { padding: 16px 32px; font-size: 12px; color: #999; border-top: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>{{ app_name }}</h1>
        </div>
        <div class="body">
            <p>Halo <strong>{{ name }}</strong>,</p>
            <p>Kami menerima permintaan untuk mereset password akun Anda. Gunakan kode berikut:</p>
            <div style="text-align: center;">
                <span class="code">{{ reset_code }}</span>
            </div>
            <p>Kode ini berlaku selama <strong>{{ expiry_minutes }} menit</strong>.</p>
            <p>Jika Anda tidak meminta reset password, abaikan email ini.</p>
        </div>
        <div class="footer">
            &copy; {{ year }} {{ app_name }}. All rights reserved.
        </div>
    </div>
</body>
</html>

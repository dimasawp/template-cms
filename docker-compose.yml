services:
  db:
    image: mysql:8.0
    container_name: cms_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-db_cms_template}
      # Uncomment below to create a non-root user.
      # Then set DB_USER + DB_PASSWORD in .env accordingly.
      # MYSQL_USER: ${DB_USER}
      # MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-root}", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./fastapi-backend
      dockerfile: Dockerfile
    container_name: cms_backend
    restart: always
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file: ./fastapi-backend/.env
    environment:
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - DB_NAME=${DB_NAME:-db_cms_template}
      - SECRET_KEY=${SECRET_KEY:-CHANGE_ME_TO_RANDOM_SECRET_DOCKER}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      - STORAGE_MODE=${STORAGE_MODE:-local_project}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./storage:/app/storage

  frontend:
    build:
      context: ./vue3-frontend
      dockerfile: Dockerfile
    container_name: cms_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    env_file: ./vue3-frontend/.env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend

  public_frontend:
    build:
      context: ./vue3-public-frontend
      dockerfile: Dockerfile
    container_name: cms_public_frontend
    restart: always
    ports:
      - "${PUBLIC_FRONTEND_PORT:-3000}:3000"
    env_file: ./vue3-public-frontend/.env
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend

volumes:
  db_data:
